<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12395c">
<title>Kehadiran Toolbox OSJ</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <header class="app-header">
    <div class="app-header-title">
      <span class="app-header-logo">🦺</span>
      <div>
        <h1>Kehadiran Toolbox</h1>
        <p>Operasi Subang Jaya 2026</p>
      </div>
    </div>
  </header>

  <main id="view-container" class="view-container"></main>

  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-btn" data-view="kehadiran">
      <span class="nav-icon">✅</span><span>Kehadiran</span>
    </button>
    <button class="nav-btn" data-view="pekerja">
      <span class="nav-icon">👥</span><span>Pekerja</span>
    </button>
    <button class="nav-btn" data-view="bulanan">
      <span class="nav-icon">📅</span><span>Bulanan</span>
    </button>
    <button class="nav-btn" data-view="laporan">
      <span class="nav-icon">🖨️</span><span>Laporan</span>
    </button>
  </nav>

</div>

<div id="toast" class="toast"></div>
<div id="modal-root"></div>

<script src="data/seed-data.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>

<script src="js/store.js"></script>
<script src="js/utils.js"></script>
<script src="js/view-kehadiran.js"></script>

</html>
